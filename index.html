<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mrskreativmaus | Häkelkunst, 3D-Druck & Buch</title>
    <style>
        :root {
            --bg-color: #faf8f5;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #6e6e6e;
            --accent-color: #cc7867;
            --accent-hover: #b86555;
            --border-color: #e8e2dc;
            --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 4px 14px rgba(204, 120, 103, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            margin: 0 auto;
        }

        /* Klickbares Profilbild */
        .profile-link {
            display: inline-block;
            border-radius: 50%;
            text-decoration: none;
            margin-bottom: 18px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-link:hover {
            transform: scale(1.04);
        }

        .profile-container {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 12px rgba(204, 120, 103, 0.15);
            background-color: #fff;
            display: block;
        }

        h1 {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 400;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 52px;
            padding: 0 16px;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            text-decoration: none;
            box-shadow: var(--shadow-subtle);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon-left,
        .btn-icon-right {
            width: 32px;
            display: flex;
            align-items: center;
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn-icon-left {
            justify-content: flex-start;
        }

        .btn-icon-right {
            justify-content: flex-end;
        }

        .btn-text {
            flex: 1;
            text-align: center;
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .btn.highlight {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 3px 10px rgba(204, 120, 103, 0.25);
        }

        .btn.highlight:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 5px 16px rgba(204, 120, 103, 0.35);
        }

        .footer {
            margin-top: 36px;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s ease;
        }

        .footer a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 380px) {
            .btn-text {
                font-size: 13.5px;
            }
            .btn {
                min-height: 48px;
                padding: 0 12px;
            }
            .btn-icon-left,
            .btn-icon-right {
                width: 26px;
                font-size: 16px;
            }
        }
    </style>
</head>
